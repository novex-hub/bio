<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Liên Hệ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b0d19 0%, #111827 50%, #1a103c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Nền hiệu ứng sao băng */
        #starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bio-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .bio-card:hover {
            transform: translateY(-4px);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        h2 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 14px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-facebook {
            background: linear-gradient(135deg, #1877f2, #0056b3);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.35);
        }

        .btn-facebook:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.6);
        }

        .btn-zalo {
            background: linear-gradient(135deg, #0068ff, #0042a5);
            box-shadow: 0 4px 15px rgba(0, 104, 255, 0.35);
        }

        .btn-zalo:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 104, 255, 0.6);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <div class="bio-card">
        <div class="avatar">✨</div>
        <h2>Cùng Giao Lưu & Chia Sẻ</h2>
        <p>Kết nối trực tiếp với mình qua các kênh bên dưới</p>
        
        <a href="https://www.facebook.com/viet.viet.677045?locale=vi_VN" target="_blank" class="btn btn-facebook">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook Cá Nhân
        </a>
        
        <a href="https://zalo.me/g/4s7ocvvyuvfmeacxsqaz" target="_blank" class="btn btn-zalo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.258c0 2.91 1.45 5.518 3.72 7.234l-.87 3.22 3.39-1.32c1.16.33 2.43.51 3.76.51 5.523 0 10-4.145 10-9.258S17.523 2 12 2z"/></svg>
            Group Zalo Hỗ Trợ
        </a>
    </div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Khởi tạo các ngôi sao tĩnh
        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            alpha: Math.random()
        }));

        // Khởi tạo danh sách sao băng
        class ShootingStar {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width + 200;
                this.y = Math.random() * -canvas.height;
                this.length = Math.random() * 80 + 40;
                this.speed = Math.random() * 10 + 6;
                this.size = Math.random() * 1.5 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.5;
            }

            update() {
                this.x -= this.speed;
                this.y += this.speed;

                if (this.x < -this.length || this.y > canvas.height + this.length) {
                    this.reset();
                }
            }

            draw() {
                const gradient = ctx.createLinearGradient(
                    this.x, this.y,
                    this.x + this.length, this.y - this.length
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.alpha})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.size;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.length, this.y - this.length);
                ctx.stroke();
            }
        }

        const shootingStars = Array.from({ length: 15 }, () => new ShootingStar());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ sao tĩnh
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ & cập nhật sao băng
            shootingStars.forEach(star => {
                star.update();
                star.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
