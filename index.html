<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Liên Hệ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .bio-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin: 10px 0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            box-sizing: border-box;
        }
        .btn-facebook {
            background-color: #1877f2;
        }
        .btn-facebook:hover {
            background-color: #145dbf;
        }
        .btn-zalo {
            background-color: #0068ff;
        }
        .btn-zalo:hover {
            background-color: #004ecb;
        }
    </style>
</head>
<body>

    <div class="bio-card">
        <h2>✨ Cùng Giao Lưu & Chia Sẻ</h2>
        <p>Kết nối trực tiếp với mình qua các kênh bên dưới:</p>
        
        <a href="https://www.facebook.com/viet.viet.677045?locale=vi_VN" target="_blank" class="btn btn-facebook">
            👉 Facebook Cá Nhân
        </a>
        
        <a href="https://zalo.me/g/4s7ocvvyuvfmeacxsqaz" target="_blank" class="btn btn-zalo">
            👉 Group Zalo Hỗ Trợ
        </a>
    </div>

</body>
</html>
